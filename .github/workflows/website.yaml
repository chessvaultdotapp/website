name: Website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-deploy:
    name: Build and deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.9.1'

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile

      - name: Read changelog pin
        id: changelog-pin
        run: echo "commit=$(node -p 'require(\"./changelogs.json\").commit')" >> "$GITHUB_OUTPUT"

      - name: Restore changelog checkout
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: .cache/chessvault
          key: changelogs-v1-${{ steps.changelog-pin.outputs.commit }}-${{ hashFiles('scripts/fetch-changelogs.ts') }}

      - name: Fetch and validate pinned changelogs
        run: pnpm changelogs:fetch

      - name: Check formatting
        run: pnpm exec oxfmt --check src astro.config.mjs playwright.config.ts tests

      - name: Lint
        run: pnpm exec oxlint --deny-warnings src astro.config.mjs playwright.config.ts tests

      - name: Check Astro diagnostics and types
        run: pnpm astro check

      - name: Test changelog integration
        run: pnpm test:unit

      - name: Install Chromium for smoke tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Test production website with a base path
        run: pnpm test:e2e

      # Rebuild at root after tests, which overwrite dist/ with a prefixed build.
      - name: Build website
        run: pnpm build --site https://${{ github.repository_owner }}.github.io

      # Cross-repository pushes require a token with contents: write on the target.
      - name: Deploy to GitHub Pages repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.GH_PAGES_DEPLOY_TOKEN }}
          external_repository: ${{ github.repository_owner }}/${{ github.repository_owner }}.github.io
          publish_branch: main
          publish_dir: ./dist
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
