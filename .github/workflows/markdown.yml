name: Markdown

on:
  push:
    paths: &markdown-paths
      - '**/*.md'
      - '.rumdl.toml'
      - '.github/workflows/markdown.yml'
  pull_request:
    paths: *markdown-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rumdl
        uses: chessvaultdotapp/actions-setup-rumdl@86f98314bd9485b425dc242c520a1df276f842e6

      - name: Check tracked Markdown files
        run: git ls-files -z '*.md' | xargs -0 -r rumdl check
